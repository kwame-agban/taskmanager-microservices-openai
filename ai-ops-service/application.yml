server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ai-ops-service

openai:
  api-key: ${OPENAI_API_KEY}

---
apiVersion: v1
kind: Service
metadata:
  name: ai-ops
spec:
  selector:
    app: ai-ops
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
  type: ClusterIP
