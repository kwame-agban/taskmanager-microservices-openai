name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  ai_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run AI Review
        run: |
          DIFF=$(git diff origin/main...HEAD)
          curl [api.openai.com](https://api.openai.com/v1/chat/completions) \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
                "model": "gpt-4o-mini",
                "messages": [
                  {"role": "system", "content": "Tu es un expert en revue de code Java Spring Boot"},
                  {"role": "user", "content": "Voici un diff à évaluer:\n'"$DIFF"'"}
                ]
              }'
