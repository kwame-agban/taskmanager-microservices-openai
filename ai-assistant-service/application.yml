server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ai-assistant-service

openai:
  api-key: ${OPENAI_API_KEY}

---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant
spec:
  selector:
    app: ai-assistant
  ports:
    - protocol: TCP
      port: 8086
      targetPort: 8086
  type: ClusterIP
