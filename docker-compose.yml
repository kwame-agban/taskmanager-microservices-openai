version: "3.9"

services:

  # -------------------------
  # DATABASES
  # -------------------------

  auth-db:
    image: postgres:15
    container_name: auth-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  task-db:
    image: postgres:15
    container_name: task-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: task_db
    ports:
      - "5434:5432"
    volumes:
      - task-db-data:/var/lib/postgresql/data

  # -------------------------
  # CORE MICROSERVICES
  # -------------------------

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SECURITY_TOKEN_SECRET: ${SECURITY_TOKEN_SECRET}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - auth-db

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    container_name: task-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-db:5432/task_db
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      - task-db

  # -------------------------
  # AI MICROSERVICES
  # -------------------------

  ai-planner-service:
    build:
      context: .
      dockerfile: ai-planner-service/Dockerfile
    container_name: ai-planner-service
    environment:
      SERVER_PORT: 8083
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8083:8083"

  ai-review-service:
    build:
      context: .
      dockerfile: ai-review-service/Dockerfile
    container_name: ai-review-service
    environment:
      SERVER_PORT: 8084
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8084:8084"

  ai-ops-service:
    build:
      context: .
      dockerfile: ai-ops-service/Dockerfile
    container_name: ai-ops-service
    environment:
      SERVER_PORT: 8085
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8085:8085"

  ai-assistant-service:
    build:
      context: .
      dockerfile: ai-assistant-service/Dockerfile
    container_name: ai-assistant-service
    environment:
      SERVER_PORT: 8086
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8086:8086"

  # -------------------------
  # API GATEWAY
  # -------------------------

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      TASK_SERVICE_URL: http://task-service:8082

      # Ajout des endpoints IA dans la gateway
      AI_PLANNER_URL: http://ai-planner-service:8083
      AI_REVIEW_URL: http://ai-review-service:8084
      AI_OPS_URL: http://ai-ops-service:8085
      AI_ASSISTANT_URL: http://ai-assistant-service:8086

    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - task-service
      - ai-planner-service
      - ai-review-service
      - ai-ops-service
      - ai-assistant-service

  # -------------------------
  # FRONTEND UI
  # -------------------------

  frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

# -------------------------
# VOLUMES
# -------------------------
volumes:
  auth-db-data:
  task-db-data:
